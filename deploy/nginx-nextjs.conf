# ==============================================================================
# Nginx Reverse Proxy Configuration for MTS Offshore (Next.js) on Hostinger VPS
# Save to:   /etc/nginx/sites-available/mtsoffshore
# Symlink to: /etc/nginx/sites-enabled/mtsoffshore
# ==============================================================================

# 1. HTTP Server Block (Redirect all HTTP traffic to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name mtsoffshore.com www.mtsoffshore.com;

    # Certbot challenge for SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block (Reverse proxy to Next.js on port 3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mtsoffshore.com www.mtsoffshore.com;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mtsoffshore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtsoffshore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Cache static Next.js assets
    location /_next/static/ {
        alias /var/www/mtsoffshore/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache public folder assets (images, css, favicon)
    location /assets/ {
        alias /var/www/mtsoffshore/public/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Reverse Proxy to Next.js Node app
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
