# ==============================================================================
# Nginx Configuration for MTS Offshore on Hostinger VPS KVM 2
# Place this at: /etc/nginx/sites-available/mtsoffshore
# Symlink to:    /etc/nginx/sites-enabled/mtsoffshore
# ==============================================================================

# 1. HTTP Server Block (Redirect HTTP to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name mtsoffshore.com www.mtsoffshore.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mtsoffshore.com www.mtsoffshore.com;

    root /var/www/mtsoffshore/dist;
    index index.html;

    # SSL Certificates (managed automatically by Certbot)
    ssl_certificate /etc/letsencrypt/live/mtsoffshore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtsoffshore.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression for High Speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/xml+rss image/svg+xml;

    # Clean URL handling (e.g. /services -> services.html)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Static Assets Caching (1 Year Cache for maximum performance)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Deny access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
