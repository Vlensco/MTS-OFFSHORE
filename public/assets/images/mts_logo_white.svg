      <polygon points="50,10 90,10 160,100 120,100" fill="#ffffff"/>
      <polygon points="90,10 130,10 200,100 160,100" fill="#e2f0fa"/>
      <polygon points="10,60 50,10 90,10 50,60" fill="#cbdde9"/>
      <polygon points="50,110 90,110 160,200 120,200" fill="#a0c2dc"/>
      <polygon points="90,110 130,110 200,200 160,200" fill="#b9d5ec"/>
      <polygon points="10,160 50,110 90,110 50,160" fill="#88b1d2"/>
